# Tests and builds the Ionic app on every pull request that touches it, and on main.
# The debug APK is kept as a build artifact to install on a phone. Signed releases, as in
# Money Trail, come once a signing key is added. See ui/README.md.
name: App build

on:
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Browser tests
        run: npm run test:ci

      - name: Build the web app and copy it into the Android project
        run: npm run build && npx cap sync android

      - name: Debug build
        working-directory: ui/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Keep the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mantralaya-yatra-debug
          path: ui/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
