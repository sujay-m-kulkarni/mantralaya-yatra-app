# Builds and tests the .NET backend on every pull request that touches it, and on main.
# Integration tests start SQL Server in Docker, which the GitHub runner provides.
# See backend/README.md.
name: Backend build

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Turned on once the first migration exists (backend/README.md, "First migration"):
      # - name: Check the migrations match the model
      #   run: >
      #     dotnet ef migrations has-pending-model-changes
      #     --project src/MantralayaYatra.Infrastructure
      #     --startup-project src/MantralayaYatra.Api
      #     --configuration Release --no-build

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger trx --results-directory TestResults

      - name: Report failing tests
        if: failure()
        run: python3 ../.github/scripts/trx-annotations.py TestResults

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults
          retention-days: 14
